services:
  postgres:
    image: postgres:17
    container_name: postgres-db
    environment:
      POSTGRES_DB: creditflow
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5438:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  adminer:
    image: adminer
    container_name: creditflow-adminer
    ports:
      - "8081:8080"

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d creditflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: