name: Credit Flow CI

on:
  push:
    branches:
      - master
      - develop
      - "feature/**"

  pull_request:
    branches:
      - master
      - develop

jobs:
  build:

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: creditflow
          POSTGRES_USER: admin
          POSTGRES_PASSWORD: admin123
        ports:
          - 5438:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Grant execute permission to Maven Wrapper
        run: chmod +x mvnw

      - name: Build project
        run: ./mvnw clean verify
        env:
            DB_USERNAME: admin
            DB_PASSWORD: admin123
            DB_URL: jdbc:postgresql://localhost:5438/creditflow
